name: Pipeline Identity Demo

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  secret-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

    steps:
      - name: Validate secret presence
        run: |
          test -n "$DEMO_SECRET" && echo "Secret injected correctly :D"
